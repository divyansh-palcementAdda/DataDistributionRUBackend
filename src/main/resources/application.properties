# ==============================================
# Application Info
# ==============================================
spring.application.name=DataDistributionSystem

# ==============================================
# Database Configuration (MySQL)
# ==============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DDS_PROJECT_DB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
#spring.datasource.password=${DB_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================
# Connection Pooling (HikariCP)
# ==============================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# ==============================================
# Hibernate / JPA
# ==============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================
# Mail Configuration (Gmail / Google Workspace / SMTP)
# ==============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:chancelloroffice@renaissance.ac.in}
spring.mail.password=${MAIL_PASSWORD:nixjsjxyddpvwvpe}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# ==============================================
# Application Email & Notification Configuration
# ==============================================
app.mail.from-email=${MAIL_FROM:chancelloroffice@renaissance.ac.in}
app.mail.from-name=${MAIL_FROM_NAME:Renaissance University CRM}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.async=${MAIL_ASYNC:true}
app.mail.max-retries=${MAIL_MAX_RETRIES:3}
app.mail.daily-reminder-cron=${APP_DAILY_REMINDER_CRON:0 30 9 * * *}
app.mail.daily-reminder-zone=${APP_TIMEZONE:Asia/Kolkata}
# Frontend and CORS URLs
app.frontend.url=${FRONTEND_URL:https://dds.areyoureporting.com}

# ==============================================
# JWT Configuration
# ==============================================
jwt.secret=${JWT_SECRET:2x9zV7kQyt8qEktJBSzGeJKaVzMeEVFkh0FcogLPBQzX8p2mW3nY5tR7uC9vA1bD4eF6gH8iJ0kL2mN4oP6qR8sT0uV2wX4yZ6aB8cD0eF2gH4iJ6k}
jwt.refresh.expiration=604800000

# ==============================================
# Logging
# ==============================================
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_BIND:INFO}

# ==============================================
# Server Config
# ==============================================
server.port=${SERVER_PORT:8083}
server.address=0.0.0.0

# ==============================================
# OpenAPI / Swagger Config
# ==============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================
# VPS File Storage Configuration
# ==============================================
app.file-storage.base-path=${APP_FILE_STORAGE_PATH:uploads}
app.file-storage.public-url=${APP_FILE_STORAGE_PUBLIC_URL:/uploads}
app.file-storage.max-file-size=${APP_FILE_MAX_SIZE:5MB}
app.file-storage.allowed-types=image/png,image/jpeg,image/jpg,image/webp

# ==============================================
# Reverse Proxy Headers Support (Behind Nginx)
# ==============================================
server.forward-headers-strategy=framework

# ==============================================
# Lead Distribution Configuration
# ==============================================
app.lead-distribution.max-daily-followups=${APP_LEAD_DISTRIBUTION_MAX_DAILY_FOLLOWUPS:30}
app.dashboard.low-data-user-threshold=${APP_DASHBOARD_LOW_DATA_USER_THRESHOLD:10}
app.dashboard.followup-login-cutoff-time=${APP_DASHBOARD_FOLLOWUP_LOGIN_CUTOFF:11:00}

# ==============================================
# CMS Integration Configuration
# ==============================================
cms.base-url=${CMS_BASE_URL:https://cms.areyoureporting.com/api}
integration.api.key=${INTEGRATION_API_KEY:default-integration-dev-key}
cms.connect-timeout=${CMS_CONNECT_TIMEOUT:10000}
cms.read-timeout=${CMS_READ_TIMEOUT:15000}

